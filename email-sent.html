<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>درخواست با موفقیت ثبت شد</title>

    <link rel="stylesheet" href="style.css?v=0.0.1">
    <link rel="stylesheet" href="responsive.css?v=0.0.1">
    <link rel="stylesheet" href="success.css?v=0.0.1">

    <link rel="icon" type="image/webp" href="logo.webp">
</head>

<body class="success-page-body">

    <main class="success-page">

        <div class="background-grid"></div>

        <header class="success-nav">
            <a href="index.html" class="brand">
                <img src="logo.webp" alt="Logo">
            </a>
        </header>

        <section class="success-content">

            <div class="success-card">

                <div class="success-icon">
                    <svg viewBox="0 0 64 64" fill="none">
                        <circle cx="32" cy="32" r="27" stroke="currentColor" stroke-width="2.5" opacity="0.2" />

                        <path d="M19 32.5L27.5 41L45 23" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"

                <span class="success-label">

                <h1>
                    درخواست شما با <strong>موفقیت</strong> ثبت شد!

                <p>
                    از اینکه ما را برای دریافت خدمات انتخاب کردید سپاسگزاریم.

                <div class="success-divider"></div>

                <div class="success-info">
                    <span>وضعیت درخواست</span>
                    <strong>ثبت شده و در انتظار بررسی</strong>
                </div>

                <a href="index.html" class="success-button">
                    <span>بازگشت به صفحه اصلی</span>
                    <b>←</b>
                </a>

                <a href="service-request.html" class="new-request">
                    ثبت درخواست جدید
                </a>

            </div>

        </section>
